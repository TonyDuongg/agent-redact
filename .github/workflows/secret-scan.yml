name: Security & Secret Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      - name: Run agent-redact action scanner
        uses: ./
        with:
          scan-path: '.'
          fail-on-leak: 'true'
          exclude: 'node_modules,dist,build,.git,coverage'

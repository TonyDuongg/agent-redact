name: Release & Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # A step's own `env:` is not visible to that step's `if:`, so the previous
      # `if: env.NODE_AUTH_TOKEN != ''` was always false and publishing was silently skipped.
      # Expose only a boolean at job level; the token itself stays scoped to the publish step.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run verification
        run: |
          npm run typecheck
          npm test

      - name: Build package
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Fail when npm token is missing
        if: env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "::error::NPM_TOKEN repository secret is not configured, so the package was NOT published."
          exit 1
